name: refresh

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: refresh
        run: SKIP_WEB_BUILD=1 ./scripts/refresh.sh

      - name: open or update PR if snapshot changed
        uses: peter-evans/create-pull-request@v7
        with:
          branch: refresh/snapshot
          base: main
          add-paths: var/snapshot/snapshot.json
          commit-message: "chore: refresh snapshot"
          title: "chore: refresh snapshot"
          body: |
            Automated daily refresh of `var/snapshot/snapshot.json`.

            Branch is reused; each run force-pushes the latest snapshot.
          author: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          committer: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
