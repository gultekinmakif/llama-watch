name: release

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write

jobs:
  tag-and-release:
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: extract version
        id: ver
        run: |
          BRANCH="${{ github.event.pull_request.head.ref }}"
          VERSION="${BRANCH#release/}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: validate version.json matches branch
        run: |
          FILE_VERSION=$(node -e 'console.log(require("./web/version.json").version)')
          if [ "$FILE_VERSION" != "${{ steps.ver.outputs.version }}" ]; then
            echo "::error::web/version.json is '$FILE_VERSION' but branch is 'release/${{ steps.ver.outputs.version }}'"
            exit 1
          fi

      - name: create tag and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.ver.outputs.version }}" \
            --target main \
            --title "${{ steps.ver.outputs.version }}" \
            --generate-notes
