name: web

on:
  push:
    branches: [main]
    paths: ['web/**']
  pull_request:
    paths: ['web/**']

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      - name: stub snapshot for static export
        # Next refuses output:'export' on a dynamic route when generateStaticParams
        # returns an empty list, so the stub seeds one protocol to produce one path.
        run: |
          mkdir -p ../var/snapshot
          echo '{"cells":[{"slug":"stub","metric":"tvl","codePath":""}],"protocols":[{"slug":"stub","name":"Stub","category":"Other","chains":["ethereum"],"dataFile":"stub.json","dimTypes":[]}]}' > ../var/snapshot/snapshot.json
      - run: bun run build
