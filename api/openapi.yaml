openapi: 3.1.0

info:
  title: llama-watch
  version: 0.1.0
  description: |
    Minimal Go HTTP server on the standard library net/http router
    (Go 1.22+ method-prefix routing); no framework lock-in.
  license:
    name: MIT

servers:
  - url: http://localhost:3000
    description: Local development

tags:
  - name: meta
    description: Liveness + diagnostic endpoints

paths:
  /:
    get:
      tags: [meta]
      summary: Root
      description: Returns 200 with an empty body. Useful as a liveness probe.
      responses:
        '200':
          description: OK

  /health:
    get:
      tags: [meta]
      summary: Liveness probe
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'

components:
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: ok

  responses:
    InternalError:
      description: Internal server error
      content:
        text/plain:
          schema:
            type: string
            example: internal error
